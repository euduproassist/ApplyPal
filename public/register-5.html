<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>ApplyPal - Create Your Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2589ff;
            --primary-blue-hover: #1a75e8;
            --text-dark: #000000;
            --text-muted: #666666;
            --input-border: #d0d7de;
            --input-focus: #2589ff;
            --bg-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            text-align: center;
        }

        .brand-logo-icon {
            font-size: 3.8rem;
            color: var(--primary-blue);
            margin-bottom: 10px;
            line-height: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.8px;
            line-height: 1.1;
        }

        .brand-name span {
            color: var(--primary-blue);
            font-weight: 700;
        }

        .brand-tagline {
            margin-top: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Section Title */
        .form-header {
            text-align: center;
            margin-bottom: 28px;
            width: 100%;
        }

        .form-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.4px;
        }

        .form-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        /* Form Controls */
        .register-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper i.lead-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .input-wrapper i.trail-icon {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .input-wrapper i.trail-icon:hover {
            color: var(--text-dark);
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;
            padding: 0 44px;
            background: #ffffff;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 0.98rem;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .input-wrapper input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(37, 137, 255, 0.15);
        }

        /* Primary Submit Button */
        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.15s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-blue-hover);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            width: 100%;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 14px;
        }

        /* Google OAuth Button */
        .btn-google {
            width: 100%;
            height: 52px;
            background: #ffffff;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }

        .btn-google:hover {
            background-color: #f8fafc;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        /* Footer Link */
        .login-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .login-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Mobile Viewport Safeguard */
        @media (max-width: 480px) {
            .register-container {
                padding: 24px 18px;
            }

            .brand-name {
                font-size: 2.1rem;
            }

            .form-header h1 {
                font-size: 1.6rem;
            }

            .input-wrapper input, .btn-submit, .btn-google {
                height: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        
        <!-- Brand Header Section -->
        <div class="brand-header">
            <div class="brand-logo-icon">
                <i class="fa-regular fa-face-smile"></i>
            </div>
            <div class="brand-name">Apply<span>Pal</span></div>
            <div class="brand-tagline">Your application buddy.</div>
        </div>

        <!-- Section Title -->
        <div class="form-header">
            <h1>Create your account</h1>
            <p>Register to save your details and<br>apply faster everywhere.</p>
        </div>

        <!-- Registration Form -->
        <form class="register-form" action="#" method="POST" onsubmit="event.preventDefault();">
            
            <!-- Email Field -->
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope lead-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock lead-icon"></i>
                    <input type="password" id="password" placeholder="Create a password" required>
                    <i class="fa-regular fa-eye trail-icon" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="input-group">
                <label for="confirm-password">Confirm password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock lead-icon"></i>
                    <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                    <i class="fa-regular fa-eye trail-icon" onclick="togglePasswordVisibility('confirm-password', this)"></i>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Register</button>

        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or</span>
        </div>

        <!-- Google Authentication Button -->
        <button type="button" class="btn-google">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>

        <!-- Login Redirect Link -->
        <div class="login-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>

    </div>

    <script>
        function togglePasswordVisibility(fieldId, iconElem) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === "password") {
                inputField.type = "text";
                iconElem.classList.remove("fa-eye");
                iconElem.classList.add("fa-eye-slash");
            } else {
                inputField.type = "password";
                iconElem.classList.remove("fa-eye-slash");
                iconElem.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
