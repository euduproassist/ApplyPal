<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApplyPal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --primary-blue-hover: #2563eb;
            --text-dark: #000000;
            --text-muted: #8e8e93;
            --input-border: #d1d5db;
            --bg-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            text-align: center;
        }

        .brand-logo-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
            color: #2563eb;
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .brand-name span {
            color: #3b82f6;
        }

        .brand-tagline {
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #1f2937;
        }

        /* Form Header */
        .form-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
        }

        .form-header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 0.95rem;
            color: #6b7280;
        }

        /* Form Controls */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #111827;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper i.lead-icon {
            position: absolute;
            left: 16px;
            color: #9ca3af;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .input-wrapper i.trail-icon {
            position: absolute;
            right: 16px;
            color: #9ca3af;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;
            padding: 0 44px;
            background: #ffffff;
            border: 1px solid #60a5fa;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #111827;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .forgot-password {
            text-align: right;
            margin-top: -8px;
        }

        .forgot-password a {
            color: #3b82f6;
            font-size: 0.88rem;
            text-decoration: none;
            font-weight: 500;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            width: 100%;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider span {
            padding: 0 16px;
        }

        /* Google OAuth Button */
        .btn-google {
            width: 100%;
            height: 52px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        /* Footer Link */
        .register-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.95rem;
            color: #6b7280;
        }

        .register-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <svg class="brand-logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="20" r="12" stroke="#2563eb" stroke-width="4"/>
                <circle cx="27" cy="18" r="2" fill="#2563eb"/>
                <circle cx="37" cy="18" r="2" fill="#2563eb"/>
                <path d="M26 24C28 26 34 26 36 24" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                <path d="M12 50C12 40 21 34 32 34C43 34 52 40 52 50" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <div class="brand-name">Apply<span>Pal</span></div>
            <div class="brand-tagline">Your application buddy.</div>
        </div>

        <div class="form-header">
            <h1>Welcome back</h1>
            <p>Login to your account to continue.</p>
        </div>

        <form class="login-form" action="#" method="POST" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope lead-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock lead-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="far fa-eye trail-icon" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <button type="button" class="btn-google">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>

        <div class="register-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, iconElem) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === "password") {
                inputField.type = "text";
                iconElem.classList.remove("fa-eye");
                iconElem.classList.add("fa-eye-slash");
            } else {
                inputField.type = "password";
                iconElem.classList.remove("fa-eye-slash");
                iconElem.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
